source:
  type: excel
  path: ${ACR_HIST_ORIGIN}
  sub_paths: 
    month: ['Activos','Inactivos']
    hist: ['Activos/Historico', 'Inactivos/Historico','Creditos/Historico','Retencion/Historico']

target:
  pasos:
    - nombre: borrar_particiones
      sql: load/acr_hist/delete_particiones.sql
      modo: por_grupo
    - nombre: insertar
      sql: load/acr_hist/insert.sql
      modo: por_fila
